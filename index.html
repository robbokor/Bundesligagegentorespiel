<style>
/* Gegentorespiel · eine Datei, kein Server, keine Abhaengigkeiten.
   Alle Daten liegen im localStorage des Geraets. */
:root{
  --paper:#F5F6F3; --sunk:#EBEDE8; --card:#FFFFFF; --card-2:#FAFBF9;
  --ink:#1E2B24; --ink-2:#5F6E66; --ink-3:#8C978F;
  --line:#E2E6DF; --line-strong:#CBD2C7;
  --grass:#2F7D53; --grass-hover:#276945; --grass-soft:#E7F2EB; --grass-line:#C4DFD0;
  --warn-soft:#FBEEDD; --warn-line:#EFD5B0; --warn-ink:#8A5A19;
  --bad-soft:#FBE6E6; --bad-line:#F0C6C6; --bad-ink:#95383F;
  --blue-soft:#E8EFF6; --blue-line:#CBDCEB; --blue-ink:#37587A;
  --lila-soft:#EEEAF7; --lila-line:#D6CDEC; --lila-ink:#5B4A87;
  --shadow:0 1px 2px rgba(30,43,36,.05), 0 10px 24px -18px rgba(30,43,36,.35);
  --r-s:10px; --r-m:16px; --r-l:22px;
  --ui:"Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--ui);
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none; padding:0; text-align:left}

.num{font-variant-numeric:tabular-nums}

.app{display:grid; grid-template-rows:auto minmax(0,1fr) auto; height:100dvh}
.topbar{display:flex; align-items:center; gap:12px; padding:12px 18px;
  background:var(--card); border-bottom:1px solid var(--line)}
.wordmark{font-weight:700; font-size:19px; color:var(--grass); display:flex; align-items:center; gap:9px}
.wordmark .ball{width:13px; height:13px; border-radius:50%; background:var(--grass)}
.topbar .spacer{flex:1}
.topbar .meta{color:var(--ink-2); font-size:13px; text-align:right}

.nav{display:grid; grid-template-columns:repeat(5,1fr); gap:4px; background:var(--card);
  border-top:1px solid var(--line); padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
.nav button{padding:10px 4px; border-radius:var(--r-s); color:var(--ink-2);
  font-size:13px; font-weight:600; text-align:center}
.nav button[aria-current="page"]{color:#fff; background:var(--grass)}

.stack{display:flex; flex-direction:column; gap:18px}

.eyebrow{font-size:13px; font-weight:700; color:var(--ink-2); text-transform:uppercase; letter-spacing:.05em}
.head-row{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 18px; border-radius:999px; font-weight:700; font-size:15px;
  border:1px solid var(--line-strong); background:var(--card); min-height:46px}
.btn:hover{background:var(--sunk)}

.btn-sm{min-height:38px; padding:6px 14px; font-size:14px}
.btn-block{width:100%}

label.f{display:flex; flex-direction:column; gap:5px; font-size:13.5px; font-weight:600; color:var(--ink-2)}
input[type=text],input[type=number],input[type=date],select,textarea{
  padding:10px 12px; border:1px solid var(--line-strong); border-radius:var(--r-s);
  background:var(--card); min-height:44px; width:100%}
.grid{display:grid; gap:12px}

  font-size:13.5px; font-weight:600; color:var(--ink-3)}

  border-radius:var(--r-s); background:var(--card)}
.item .grow{flex:1; min-width:0}
.item .grow b{display:block}

.chk input{width:20px; height:20px; min-height:0}
hr{border:none; border-top:1px solid var(--line); margin:4px 0}
.hide{display:none !important}

<div class="app">
  <header class="topbar">
    <div class="wordmark"><span class="ball"></span>Gegentorespiel</div>
    <div class="spacer"></div>
    <div class="meta" id="topMeta"></div>
  </header>
  <main><div class="wrap" id="view"></div></main>
  <nav class="nav" id="nav" aria-label="Bereiche"></nav>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Zustand                                                             *
 * ------------------------------------------------------------------ */

const LS_KEY = "gegentorespiel.v1";
const API = "https://api.openligadb.de";

const LIGEN = {
  bl1:   { name: "1. Bundesliga", kurz: "1. BL",  api: true  },
  bl2:   { name: "2. Bundesliga", kurz: "2. BL",  api: true  },
  bl3:   { name: "3. Liga",       kurz: "3. L",   api: true  },
  lokal: { name: "Eigene Teams",  kurz: "Eigene", api: false }
};
const LIGA_IDS = Object.keys(LIGEN);

function leerZustand(){
  return {
    version: 1,
    saison: "2026",              // OpenLigaDB zaehlt die Saison nach dem Startjahr
    betragCent: 100,             // Einsatz je Gegentor
    deckelCent: null,            // optionale Obergrenze je Spieler, null = keine
    zweck: "Mannschaftskasse",
    spieler: [],                 // {id, name, teamId}
    teams: [],                   // {id, name, liga, olId, topf}
    spiele: [],                  // {id, teamId, spieltag, datum, gegner, heim, tore, gegentore, quelle, olId, wettbewerb}
    zahlungen: [],               // {id, spielerId, cent, datum, notiz}
    letzterAbruf: null,          // ISO-Zeitpunkt des letzten API-Abrufs
    planStand: null              // Stand des zuletzt eingelesenen Spielplans
  };
}

let S = laden();
let VIEW = "stand";
let FLASH = null;                // {art, text} – einmalige Rueckmeldung
let BUSY = false;
let LETZTER_TEXT = null;              // Ersatzweg, wenn die Zwischenablage sich sperrt

function laden(){
  try{
    const roh = localStorage.getItem(LS_KEY);
    if (!roh) return erstStart();
    const z = JSON.parse(roh);
    const d = leerZustand();
    for (const k in d) if (!(k in z)) z[k] = d[k];
    // Aeltere Staende kannten den Lostopf je Mannschaft noch nicht.
    z.teams.forEach(t => { if (t.topf === undefined) t.topf = true; });
    return z;
  }catch(e){
    console.warn("Zustand nicht lesbar, starte leer:", e);
    return erstStart();
  }
}

function erstStart(){
  const z = leerZustand();
  // Die beiden eigenen Mannschaften sind gesetzt – sie kommen aus keiner API.
  z.teams.push({ id: uid(), name: "FSC Rheda I",  liga: "lokal", olId: null, topf: true });
  z.teams.push({ id: uid(), name: "FSC Rheda II", liga: "lokal", olId: null, topf: true });
  return z;
}

function sichern(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ alert("Speichern fehlgeschlagen: " + e.message); }
}

/* ------------------------------------------------------------------ *
 * Kleinkram                                                           *
 * ------------------------------------------------------------------ */

const $ = s => document.querySelector(s);
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function euro(cent){
  const v = (cent||0)/100;
  return v.toLocaleString("de-DE",{style:"currency",currency:"EUR"});
}
function centAus(text){
  const t = String(text||"").replace(/\s|€/g,"").replace(",",".");
  const v = parseFloat(t);
  return isFinite(v) ? Math.round(v*100) : null;
}
function datumKurz(iso){
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return String(iso).slice(0,10);
  return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"});
}
function heute(){ return new Date().toISOString().slice(0,10); }
function team(id){ return S.teams.find(t => t.id === id) || null; }
function teamName(id){ const t = team(id); return t ? t.name : "—"; }
function saisonLabel(){ const a = parseInt(S.saison,10); return a ? a + "/" + String(a+1).slice(-2) : S.saison; }

function flash(art, text){ FLASH = {art, text}; }

/* ------------------------------------------------------------------ *
 * Rechnen                                                             *
 * ------------------------------------------------------------------ */

const WETTBEWERBE = { liga:"Liga", pokal:"Pokal", freund:"Freundschaftsspiel" };
// Gezahlt wird nur fuer Ligaspiele. Pokal und Freundschaftsspiele duerfen
// erfasst werden, zaehlen aber nicht mit. Aeltere Eintraege ohne Angabe
// sind Ligaspiele: etwas anderes liess sich frueher gar nicht eintragen.
function zaehlt(s){
  return (s.wettbewerb || "liga") === "liga" && typeof s.gegentore === "number";
}
// Aus dem Spielplan uebernommen, aber noch ohne Ergebnis.
function offen(s){ return typeof s.gegentore !== "number"; }

function spieleVonTeam(teamId){
  return S.spiele.filter(s => s.teamId === teamId)
                 .sort((a,b) => String(a.datum||"").localeCompare(String(b.datum||"")));
}
function gegentoreVonTeam(teamId){
  return S.spiele.reduce((n,s) => (s.teamId === teamId && zaehlt(s)) ? n + (s.gegentore||0) : n, 0);
}
function ligaSpieleVonTeam(teamId){
  return S.spiele.reduce((n,s) => (s.teamId === teamId && zaehlt(s)) ? n+1 : n, 0);
}
function bezahltVon(spielerId){
  return S.zahlungen.reduce((n,z) => z.spielerId === spielerId ? n + (z.cent||0) : n, 0);
}
function schuldVon(sp){
  if (!sp.teamId) return 0;
  let cent = gegentoreVonTeam(sp.teamId) * S.betragCent;
  if (S.deckelCent != null) cent = Math.min(cent, S.deckelCent);
  return cent;
}
function tabelle(){
  return S.spieler.map(sp => {
    const soll = schuldVon(sp), ist = bezahltVon(sp.id);
    return {
      sp,
      tore: sp.teamId ? gegentoreVonTeam(sp.teamId) : 0,
      spiele: sp.teamId ? ligaSpieleVonTeam(sp.teamId) : 0,
      soll, ist, offen: soll - ist
    };
  }).sort((a,b) => b.tore - a.tore || a.sp.name.localeCompare(b.sp.name,"de"));
}
function summe(){
  const t = tabelle();
  return {
    soll:  t.reduce((n,r) => n + r.soll, 0),
    ist:   t.reduce((n,r) => n + r.ist, 0),
    offen: t.reduce((n,r) => n + r.offen, 0)
  };
}

/* ------------------------------------------------------------------ *
 * OpenLigaDB                                                          *
 *                                                                     *
 * Frei zugaenglich, ohne Schluessel. Antwortet die Schnittstelle       *
 * nicht, bleibt die Handeingabe der vollstaendige Weg – die           *
 * Anwendung haengt nicht daran.                                       *
 * ------------------------------------------------------------------ */

async function hole(pfad){
  const r = await fetch(API + pfad, { headers: { "Accept": "application/json" } });
  if (!r.ok) throw new Error("OpenLigaDB antwortet mit " + r.status);
  return r.json();
}
// OpenLigaDB hat die Feldnamen zwischen den Fassungen von Gross- auf
// Kleinschreibung umgestellt. Beide Schreibweisen werden gelesen.
function feld(o, ...namen){
  if (!o) return undefined;
  for (const n of namen){
    if (o[n] !== undefined) return o[n];
    const gross = n.charAt(0).toUpperCase() + n.slice(1);
    if (o[gross] !== undefined) return o[gross];
  }
  return undefined;
}

async function teamsLaden(liga){
  const roh = await hole("/getavailableteams/" + liga + "/" + encodeURIComponent(S.saison));
  if (!Array.isArray(roh) || !roh.length) throw new Error("Keine Mannschaften für " + LIGEN[liga].name + " " + saisonLabel() + " geliefert.");
  let neu = 0;
  for (const t of roh){
    const olId = feld(t,"teamId");
    const name = feld(t,"teamName") || feld(t,"shortName");
    if (!name) continue;
    const da = S.teams.find(x => x.liga === liga && (x.olId === olId || x.name === name));
    if (da){ da.name = name; da.olId = olId != null ? olId : da.olId; continue; }
    S.teams.push({ id: uid(), name, liga, olId: olId != null ? olId : null, topf: liga !== "bl3" });
    neu++;
  }
  return { gesamt: roh.length, neu };
}

function endstand(spiel){
  const erg = feld(spiel,"matchResults") || [];
  let e = erg.find(r => feld(r,"resultTypeID","resultTypeId") === 2)
       || erg.find(r => /end/i.test(String(feld(r,"resultName")||"")));
  if (!e && erg.length) e = erg[erg.length-1];
  if (e){
    const a = feld(e,"pointsTeam1"), b = feld(e,"pointsTeam2");
    if (typeof a === "number" && typeof b === "number") return [a,b];
  }
  // Notfalls aus den einzelnen Toren zaehlen
  const tore = feld(spiel,"goals");
  if (Array.isArray(tore) && tore.length){
    const l = tore[tore.length-1];
    const a = feld(l,"scoreTeam1"), b = feld(l,"scoreTeam2");
    if (typeof a === "number" && typeof b === "number") return [a,b];
  }
  return null;
}

// Holt die ganze Saison einer Liga und schreibt die Ergebnisse fort.
// Bereits vorhandene Abruf-Eintraege derselben Liga werden ersetzt,
// von Hand erfasste Spiele bleiben unangetastet.
async function ergebnisseLaden(liga){
  const roh = await hole("/getmatchdata/" + liga + "/" + encodeURIComponent(S.saison));
  if (!Array.isArray(roh)) throw new Error("Unerwartete Antwort der Schnittstelle.");

  const nachOlId = new Map(), nachName = new Map();
  for (const t of S.teams){
    if (t.liga !== liga) continue;
    if (t.olId != null) nachOlId.set(String(t.olId), t);
    nachName.set(t.name, t);
  }
  const finde = tm => {
    const id = feld(tm,"teamId");
    if (id != null && nachOlId.has(String(id))) return nachOlId.get(String(id));
    const n = feld(tm,"teamName");
    return n && nachName.has(n) ? nachName.get(n) : null;
  };

  const behalten = S.spiele.filter(s => {
    if (s.quelle !== "api") return true;
    const t = team(s.teamId);
    return !t || t.liga !== liga;
  });
  const frisch = [];
  let gewertet = 0, offen = 0;

  for (const m of roh){
    const fertig = feld(m,"matchIsFinished");
    const erg = endstand(m);
    if (!erg){ offen++; continue; }
    if (fertig === false){ offen++; continue; }
    const t1 = feld(m,"team1"), t2 = feld(m,"team2");
    const a = finde(t1), b = finde(t2);
    const spieltag = feld(m,"group") ? feld(feld(m,"group"),"groupOrderID","groupOrderId") : null;
    const datum = feld(m,"matchDateTime") || feld(m,"matchDateTimeUTC");
    const olId  = feld(m,"matchID","matchId");
    gewertet++;
    if (a) frisch.push({ id: uid(), teamId: a.id, spieltag, datum, gegner: feld(t2,"teamName")||"?",
                         heim: true,  tore: erg[0], gegentore: erg[1], quelle: "api", olId, wettbewerb: "liga" });
    if (b) frisch.push({ id: uid(), teamId: b.id, spieltag, datum, gegner: feld(t1,"teamName")||"?",
                         heim: false, tore: erg[1], gegentore: erg[0], quelle: "api", olId, wettbewerb: "liga" });
  }

  S.spiele = behalten.concat(frisch);
  S.letzterAbruf = new Date().toISOString();
  return { gewertet, offen, eintraege: frisch.length };
}

/* ------------------------------------------------------------------ *
 * Spielplan der eigenen Mannschaften                                  *
 *                                                                     *
 * Eine Datei neben dieser Seite, taeglich von einem Arbeitsablauf auf *
 * GitHub erneuert. Sie enthaelt Datum, Gegner und Wettbewerb - keine  *
 * Ergebnisse: die sind auf fussball.de nicht maschinenlesbar. Die     *
 * Tore traegt man hier nach.                                          *
 * ------------------------------------------------------------------ */

async function spielplanLaden(){
  const r = await fetch("daten/rheda.json?stand=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("Spielplan nicht erreichbar (" + r.status + ")");
  const d = await r.json();
  if (!d || !Array.isArray(d.mannschaften)) throw new Error("Die Spielplandatei ist unbrauchbar.");

  // Der Spielplan reicht in die Vorsaison zurueck. Gezaehlt wird nur,
  // was zur eingestellten Saison gehoert - sie beginnt im Juli.
  const ab = (parseInt(S.saison,10) || new Date().getFullYear()) + "-07-01";

  let neu = 0, erneuert = 0, geschuetzt = 0, alt = 0;
  for (const m of d.mannschaften){
    let t = S.teams.find(x => x.name === m.appName);
    if (!t){
      t = { id: uid(), name: m.appName, liga: "lokal", olId: null, topf: true };
      S.teams.push(t);
    }
    for (const sp of (m.spiele || [])){
      if (sp.art !== "liga" || sp.abgesetzt || !sp.nr) continue;
      if (!sp.datum || sp.datum < ab){ alt++; continue; }
      const da = S.spiele.find(x => x.teamId === t.id && x.planNr === sp.nr);
      if (da){
        // Von Hand eingetragene Zahlen bleiben unangetastet.
        if (da.quelle === "hand"){ geschuetzt++; continue; }
        da.datum = sp.datum; da.gegner = sp.gegner; da.heim = !!sp.heim;
        erneuert++;
        continue;
      }
      S.spiele.push({
        id: uid(), teamId: t.id, spieltag: null,
        datum: sp.datum, gegner: sp.gegner, heim: !!sp.heim,
        tore: null, gegentore: null,
        wettbewerb: "liga", quelle: "plan", olId: null, planNr: sp.nr
      });
      neu++;
    }
  }
  S.planStand = d.stand || new Date().toISOString();
  return { neu, erneuert, geschuetzt, alt };
}

function planAlter(){

/* ------------------------------------------------------------------ *
 * Weitergeben                                                          *
 *                                                                      *
 * Die Daten liegen nur auf diesem Geraet. Wer den Stand sehen soll,    *
 * bekommt ihn als Text fuer die Gruppe oder als Link, in dem der Stand *
 * selbst steckt - eine Momentaufnahme, kein Zugriff auf die Kasse.     *
 * ------------------------------------------------------------------ */

function b64ein(text){
  let roh = "";
  new TextEncoder().encode(text).forEach(b => roh += String.fromCharCode(b));
  return btoa(roh).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64aus(t){
  const roh = atob(t.replace(/-/g,"+").replace(/_/g,"/"));
  return new TextDecoder().decode(Uint8Array.from(roh, c => c.charCodeAt(0)));
}

  if (!t.length) zeilen.push("Noch keine Mitspieler.");
  t.forEach((r,i) => {

      " – " + euro(r.soll) + (r.offen > 0 ? "" : " (bezahlt)"));

function teilLink(){
  const t = tabelle();

  };
  const basis = location.href.split("#")[0];
  return basis + "#stand=" + b64ein(JSON.stringify(kurz));
}

async function inZwischenablage(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    const f = document.createElement("textarea");
    f.value = text; f.style.position = "fixed"; f.style.opacity = "0";
    document.body.appendChild(f); f.select();
    let ok = false;
    try{ ok = document.execCommand("copy"); }catch(e2){}
    document.body.removeChild(f);
    return ok;
  }
}

// Wird die Seite mit einem Stand im Adresszusatz geoeffnet, zeigt sie nur
// diesen an. Nichts wird gelesen, nichts gespeichert - die eigenen Daten
// des Betrachters bleiben unberuehrt.
function geteilterStand(){
  const m = location.hash.match(/^#stand=(.+)$/);
  if (!m) return null;
  try{
    const d = JSON.parse(b64aus(m[1]));
    return (d && d.v === 1 && Array.isArray(d.r)) ? d : null;
  }catch(e){ return null; }
}

        (r.offen>0 ? esc(euro(r.offen))+" offen" : "ausgeglichen")+'</div>'+
      (r.offen>0
        ? '<button class="btn btn-primary btn-sm" data-act="zahlOffen" data-id="'+r.sp.id+'" data-cent="'+r.offen+'">offen buchen</button>'
        : '')+
      '</div>';
  });
  h += '</div></div>';

  h += '<div class="section"><div class="eyebrow">Zahlung eintragen</div>'+
       '<div class="card pad"><form data-form="zahlungNeu"><div class="grid g3">'+
       '<label class="f">Spieler<select name="spielerId" required><option value="">— wählen —</option>'+
       S.spieler.map(sp => '<option value="'+sp.id+'">'+esc(sp.name)+'</option>').join("")+
       '</select></label>'+
       '<label class="f">Betrag (€)<input type="text" name="betrag" inputmode="decimal" placeholder="z. B. 12,50" required></label>'+
       '<label class="f">Datum<input type="date" name="datum" value="'+heute()+'"></label>'+
       '</div><label class="f" style="margin-top:12px">Notiz<input type="text" name="notiz" placeholder="optional"></label>'+
       '<hr><button class="btn btn-primary btn-block" type="submit">Buchen</button></form></div></div>';

  const z = S.zahlungen.slice().sort((a,b)=>String(b.datum||"").localeCompare(String(a.datum||"")));
  h += '<div class="section"><div class="eyebrow">Buchungen</div>';
  if (!z.length) h += '<p class="muted">Noch keine Zahlung eingetragen.</p>';
  else {
    h += '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Datum</th><th>Spieler</th>'+
         '<th>Notiz</th><th class="r">Betrag</th><th></th></tr></thead><tbody>';
    z.forEach(b => {
      const sp = S.spieler.find(x => x.id === b.spielerId);
      h += '<tr><td class="num">'+esc(datumKurz(b.datum))+'</td>'+
        '<td>'+esc(sp?sp.name:"(gelöscht)")+'</td><td class="muted">'+esc(b.notiz||"")+'</td>'+
        '<td class="r num">'+esc(euro(b.cent))+'</td>'+
        '<td class="r"><button class="btn btn-ghost btn-sm" data-act="zahlungWeg" data-id="'+b.id+'">löschen</button></td></tr>';
    });
    h += '</tbody></table></div></div>';
  }
  h += '</div>';
  return h;
}

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-nav],[data-act]");
  if (!el) return;
  const nav = el.getAttribute("data-nav");
  if (nav){ gehe(nav); return; }
  const act = el.getAttribute("data-act");
  const id  = el.getAttribute("data-id");

  if (act === "spielerWeg"){
    const sp = S.spieler.find(x => x.id === id);
    if (sp && confirm(sp.name + " entfernen? Zahlungen dieses Spielers werden mitgelöscht.")){
      S.spieler = S.spieler.filter(x => x.id !== id);
      S.zahlungen = S.zahlungen.filter(z => z.spielerId !== id);
      sichern(); zeichnen();
    }
    return;
  }
  if (act === "spielWeg"){
    S.spiele = S.spiele.filter(s => s.id !== id); sichern(); zeichnen(); return;
  }
  if (act === "zahlungWeg"){
    S.zahlungen = S.zahlungen.filter(z => z.id !== id); sichern(); zeichnen(); return;
  }
  if (act === "teamWeg"){
    const t = team(id);
    if (!t) return;
    const belegt = S.spieler.some(sp => sp.teamId === id);
    const spiele = spieleVonTeam(id).length;
    if (!confirm(t.name + " löschen?" + (belegt ? " Achtung: die Mannschaft ist gezogen." : "") +
                 (spiele ? " " + spiele + " Spiele werden mitgelöscht." : ""))) return;
    S.teams = S.teams.filter(x => x.id !== id);
    S.spiele = S.spiele.filter(s => s.teamId !== id);
    S.spieler.forEach(sp => { if (sp.teamId === id) sp.teamId = null; });
    sichern(); zeichnen(); return;
  }
  if (act === "planLaden"){
    BUSY = true; el.disabled = true; el.textContent = "lädt …";
    try{
      const r = await spielplanLaden();
      sichern();
      flash("ok", "Spielplan gelesen: " + r.neu + " neue Spiele, " + r.erneuert + " aufgefrischt" +
            (r.geschuetzt ? ", " + r.geschuetzt + " von Hand eingetragene unangetastet" : "") +
            (r.alt ? ", " + r.alt + " aus der Vorsaison übergangen" : "") + ".");
    }catch(e){
      flash("bad", "Spielplan nicht gelesen: " + e.message +
            " – auf dem eigenen Rechner ohne Server gibt es die Datei nicht; die Handeingabe bleibt.");
    }
    BUSY = false; zeichnen(); return;
  }
  if (act === "topfUm"){
    const t = team(id);
    if (t){ t.topf = (t.topf === false); sichern(); zeichnen(); }
    return;
  }
  if (act === "topfAlle" || act === "topfKeine"){
    const liga = el.getAttribute("data-liga"), an = act === "topfAlle";
    S.teams.forEach(t => { if (t.liga === liga) t.topf = an; });
    sichern(); zeichnen(); return;
  }
  if (act === "zahlOffen"){
    const cent = parseInt(el.getAttribute("data-cent"),10) || 0;
    if (cent <= 0) return;
    S.zahlungen.push({ id: uid(), spielerId: id, cent, datum: heute(), notiz: "offener Betrag" });
    sichern(); flash("ok","Zahlung über "+euro(cent)+" gebucht."); zeichnen(); return;
  }
  if (act === "teamsHolen" || act === "abrufen"){
    const liga = el.getAttribute("data-liga");
    BUSY = true; el.disabled = true; el.textContent = "lädt …";
    try{
      if (act === "teamsHolen"){
        const r = await teamsLaden(liga);
        sichern();
        flash("ok", LIGEN[liga].name + " " + saisonLabel() + ": " + r.gesamt + " Mannschaften, davon " + r.neu + " neu.");
      } else {
        const r = await ergebnisseLaden(liga);
        sichern();
        flash("ok", LIGEN[liga].name + ": " + r.gewertet + " gespielte Partien übernommen" +
              (r.offen ? ", " + r.offen + " noch ohne Ergebnis" : "") + ".");
      }
    }catch(e){
      flash("bad", "Abruf fehlgeschlagen: " + e.message +
            " – die Ergebnisse lassen sich weiterhin von Hand eintragen.");
    }
    BUSY = false; zeichnen(); return;
  }
  if (act === "export"){
    const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "gegentorespiel-" + saisonLabel().replace("/","-") + "-" + heute() + ".json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    return;
  }
  if (act === "importAn"){ $("#importFeld").click(); return; }
  if (act === "textKopieren" || act === "linkKopieren"){
    const text = act === "textKopieren" ? standAlsText() : teilLink();
    if (navigator.share){
      try{ await navigator.share({ text }); return; }catch(e){ /* abgebrochen: weiter kopieren */ }
    }
    const ok = await inZwischenablage(text);
    flash(ok ? "ok" : "warn", ok
      ? (act === "textKopieren" ? "Liste kopiert – in WhatsApp einfügen." : "Link kopiert.")
      : "Kopieren hat nicht geklappt. Der Text steht unten zum Markieren.");
    if (!ok) LETZTER_TEXT = text;
    zeichnen(); return;
  }
  if (act === "neueSaison"){
    const naechste = String((parseInt(S.saison,10) || new Date().getFullYear()) + 1);
    if (!confirm("Neue Saison " + naechste + " beginnen?\n\nMitspieler und Mannschaften bleiben, " +
                 "Ergebnisse und Kasse werden gelöscht. Vorher sichern!")) return;
    S.saison = naechste;
    S.spiele = []; S.zahlungen = [];
    S.letzterAbruf = null; S.planStand = null;
    S.spieler.forEach(sp => sp.teamId = null);
    sichern(); VIEW = "losung";
    flash("ok","Saison " + naechste + " steht. Jetzt neu auslosen.");
    zeichnen(); return;
  }
  if (act === "reset"){
    if (confirm("Wirklich alles löschen? Spieler, Mannschaften, Ergebnisse und Kasse sind dann weg.") &&
        confirm("Letzte Nachfrage: Es gibt kein Zurück ohne Sicherung.")){
      localStorage.removeItem(LS_KEY);
      S = erstStart(); sichern(); VIEW = "stand";
      flash("ok","Alles zurückgesetzt."); zeichnen();
    }
    return;
  }
});

document.addEventListener("change", ev => {
  if (ev.target.id !== "importFeld") return;
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  const leser = new FileReader();
  leser.onload = () => {
    try{
      const z = JSON.parse(leser.result);
      if (!z || !Array.isArray(z.spieler) || !Array.isArray(z.teams)) throw new Error("Das ist keine Sicherung dieser Anwendung.");
      if (!confirm("Sicherung einlesen? Der jetzige Stand wird ersetzt.")) return;
      const d = leerZustand();
      for (const k in d) if (!(k in z)) z[k] = d[k];
      S = z; sichern(); VIEW = "stand";
      flash("ok","Sicherung eingelesen."); zeichnen();
    }catch(e){ flash("bad","Einlesen fehlgeschlagen: "+e.message); zeichnen(); }
  };
  leser.readAsText(f);
});

document.addEventListener("submit", ev => {
  const f = ev.target.closest("form[data-form]");
  if (!f) return;
  ev.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries());
  const art = f.getAttribute("data-form");

  if (art === "spielerNeu"){
    const name = (d.name||"").trim();
    if (!name) return;
    if (S.spieler.some(s => s.name.toLowerCase() === name.toLowerCase())){
      flash("warn", name + " steht schon auf der Liste."); zeichnen(); return;
    }
    S.spieler.push({ id: uid(), name, teamId: null });
    sichern(); zeichnen(); return;
  }
  if (art === "spielerTeam"){
    const sp = S.spieler.find(x => x.id === d.id);
    if (sp){ sp.teamId = d.teamId || null; sichern(); }
    zeichnen(); return;
  }
  if (art === "losen"){
    const einmalig = !!d.einmalig, alle = !!d.alle;
    const ziehen = alle ? S.spieler.slice() : S.spieler.filter(sp => !sp.teamId);
    if (!ziehen.length){ flash("warn","Alle haben schon eine Mannschaft. Zum Neuziehen den Haken setzen."); zeichnen(); return; }
    let topf = S.teams.filter(t => t.topf !== false);
    if (!topf.length){ flash("warn","Im Lostopf ist keine Mannschaft angekreuzt."); zeichnen(); return; }
    if (einmalig && !alle){
      const vergeben = new Set(S.spieler.filter(sp => sp.teamId).map(sp => sp.teamId));
      topf = topf.filter(t => !vergeben.has(t.id));
    }
    if (!topf.length){ flash("bad","Im Lostopf ist keine freie Mannschaft."); zeichnen(); return; }
    if (einmalig && topf.length < ziehen.length){
      flash("warn","Nur "+topf.length+" freie Mannschaften für "+ziehen.length+" Spieler – es bleiben welche ohne."); 
    }
    for (let i = topf.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [topf[i], topf[j]] = [topf[j], topf[i]];
    }
    if (alle) S.spieler.forEach(sp => sp.teamId = null);
    ziehen.forEach((sp, i) => {
      const t = einmalig ? topf[i] : topf[Math.floor(Math.random()*topf.length)];
      sp.teamId = t ? t.id : null;
    });
    sichern();
    if (!FLASH) flash("ok","Ausgelost. Viel Spaß – und wenig Gegentore.");
    VIEW = "stand"; zeichnen(); return;
  }
  if (art === "ergebnis"){
    const sp = S.spiele.find(x => x.id === d.id);
    const geg = parseInt(d.gegentore,10);
    if (!sp || !isFinite(geg) || geg < 0){ flash("warn","Gegentore fehlen."); zeichnen(); return; }
    sp.gegentore = geg;
    sp.tore = d.tore === "" || d.tore == null ? null : (parseInt(d.tore,10) || 0);
    sp.quelle = "hand";                       // ab jetzt vor jedem Import sicher
    sichern();
    flash("ok", teamName(sp.teamId) + ": " + geg + " Gegentore eingetragen.");
    zeichnen(); return;
  }
  if (art === "spielNeu"){
    if (!d.teamId){ flash("warn","Erst eine Mannschaft wählen."); zeichnen(); return; }
    const geg = parseInt(d.gegentore,10);
    if (!isFinite(geg) || geg < 0){ flash("warn","Gegentore fehlen."); zeichnen(); return; }
    S.spiele.push({
      id: uid(), teamId: d.teamId,
      spieltag: d.spieltag ? parseInt(d.spieltag,10) : null,
      datum: d.datum || heute(),
      gegner: (d.gegner||"").trim(),
      heim: true,
      tore: parseInt(d.tore,10) || 0,
      gegentore: geg,
      wettbewerb: WETTBEWERBE[d.wettbewerb] ? d.wettbewerb : "liga",
      quelle: "hand", olId: null
    });
    sichern();
    flash("ok", d.wettbewerb === "liga"
      ? "Spiel eingetragen: "+geg+" Gegentore für "+teamName(d.teamId)+"."
      : WETTBEWERBE[d.wettbewerb]+" eingetragen – zählt nicht für die Kasse.");
    zeichnen(); return;
  }
  if (art === "zahlungNeu"){
    const cent = centAus(d.betrag);
    if (!d.spielerId || cent == null || cent <= 0){ flash("warn","Spieler und Betrag prüfen."); zeichnen(); return; }
    S.zahlungen.push({ id: uid(), spielerId: d.spielerId, cent, datum: d.datum || heute(), notiz: (d.notiz||"").trim() });
    sichern(); flash("ok","Zahlung gebucht."); zeichnen(); return;
  }
  if (art === "regeln"){
    const b = centAus(d.betrag);
    if (b == null || b <= 0){ flash("warn","Der Einsatz muss größer als null sein."); zeichnen(); return; }
    S.betragCent = b;
    const dk = (d.deckel||"").trim();
    S.deckelCent = dk ? centAus(dk) : null;
    const sa = (d.saison||"").trim();
    if (/^\d{4}$/.test(sa)) S.saison = sa;
    S.zweck = (d.zweck||"").trim();
    sichern(); flash("ok","Übernommen."); zeichnen(); return;
  }
  if (art === "teamNeu"){
    const name = (d.name||"").trim();
    if (!name) return;
    if (S.teams.some(t => t.name.toLowerCase() === name.toLowerCase())){
      flash("warn","Diese Mannschaft gibt es schon."); zeichnen(); return;
    }
    S.teams.push({ id: uid(), name, liga: "lokal", olId: null, topf: true });
    sichern(); flash("ok",name+" angelegt."); zeichnen(); return;
  }
});

const GETEILT = geteilterStand();
if (GETEILT) zeigeGeteilt(GETEILT); else zeichnen();
