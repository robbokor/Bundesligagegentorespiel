name: FSC Rheda Spielplan

on:
  schedule:
    # Taeglich um 05:30 UTC. Die Amateurergebnisse stehen ohnehin erst
    # dann drin, wenn sie jemand in DFBnet eingetragen hat.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      modus:
        description: "pruefen = nur anzeigen, holen = schreiben und einchecken"
        required: true
        default: pruefen
        type: choice
        options: [pruefen, holen]

jobs:
  spielplan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prüflauf
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modus == 'pruefen' }}
        run: node werkzeug/rheda-holen.mjs --pruefen

      - name: Spielplan holen
        if: ${{ github.event_name == 'schedule' || inputs.modus == 'holen' }}
        run: node werkzeug/rheda-holen.mjs

      - name: Änderung einchecken
        if: ${{ github.event_name == 'schedule' || inputs.modus == 'holen' }}
        run: |
          git config user.name  "FSC-Rheda-Spielplan"
          git config user.email "actions@github.com"
          # Erst vormerken: eine noch unbekannte Datei sieht "git diff" sonst nicht.
          git add -A daten/rheda.json
          if git diff --cached --quiet; then
            echo "Keine Änderung am Spielplan."
            exit 0
          fi
          git commit -m "Spielplan FSC Rheda vom $(date -u +%d.%m.%Y) übernommen"
          git push
